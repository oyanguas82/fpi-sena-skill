name: Publicar release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente a publicar (p. ej. v1.4.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Crear o actualizar el release con los paquetes de dist/
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notas.md <<NOTAS
          Agente FPI SENA: planeación pedagógica (GFPI-F-134), guías de aprendizaje (GFPI-F-135 V04), instrumentos de evaluación, juicios evaluativos y planes de mejoramiento.

          **Descargas**
          - \`fpi-sena-plugin-chatgpt.zip\` → ChatGPT: Complementos / Plugins › subir plugin (trae las cinco skills).
          - Claude (web/escritorio): Configuración › Capacidades › Skills › subir cada \`*-skill.zip\`. **\`guia-aprendizaje-sena-skill.zip\` es obligatoria** (catálogo curricular); luego \`asistente-fpi-sena\`, \`planeacion-pedagogica-sena\`, \`instrumentos-evaluacion-sena\` y \`juicios-evaluativos-sena\`.

          ⚠️ No descargue **Source code**: es el código del proyecto para desarrolladores y no se instala en Claude ni en ChatGPT.

          **Claude Code**
          \`\`\`
          /plugin marketplace add ${GITHUB_REPOSITORY}
          /plugin install fpi-sena@fpi-sena-marketplace
          \`\`\`
          NOTAS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "FPI SENA $TAG" --notes-file notas.md
          fi
